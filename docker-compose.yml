services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: devops-assignment:local
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/')
      interval: 10s
      timeout: 3s
      retries: 5

  worker:
    image: devops-assignment:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
    command: ["celery", "-A", "worker", "worker", "--loglevel=info"]
    depends_on:
      redis:
        condition: service_healthy

  claims-api:
    image: devops-assignment:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    working_dir: /app
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      MAX_PDF_BYTES: ${MAX_PDF_BYTES:-20971520}
      MAX_PDF_PAGES: ${MAX_PDF_PAGES:-100}
      SEGREGATION_BATCH_SIZE: ${SEGREGATION_BATCH_SIZE:-8}
    command: ["uvicorn", "claims_pipeline.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8001:8000"

volumes:
  redis-data: